# 这台构建机 2GB 内存且没有 swap: 堆给到 640m 是实测能过 aapt/dex 的下限量级,
# daemon 与 parallel 一开就会和 JVM 自己抢内存, 直接被 OOM killer 挑掉。
org.gradle.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
